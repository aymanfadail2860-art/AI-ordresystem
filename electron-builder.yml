# Pakning til macOS (.dmg). Kør: npm run dist:mac (på en Mac).
appId: dk.aidispatch.app
productName: AI Dispatch
copyright: Copyright © 2026
directories:
  output: release
  buildResources: build
files:
  - dist/main/**
  - dist/renderer/**
  - package.json
  - "!**/*.map"
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
# imsg (MIT) medfølger, hvis den er lagt i vendor/imsg (se INSTALLATION.md)
extraResources:
  - from: vendor/imsg
    to: imsg
    filter: ["**/*"]
mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSAppleEventsUsageDescription: AI Dispatch sender SMS-svar til kunder via Beskeder-appen.
    LSUIElement: false
  # Notarisering: sæt APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD og APPLE_TEAM_ID i miljøet
  notarize: true
dmg:
  title: AI Dispatch
publish:
  # Opdateringer distribueres via GitHub Releases (privat repo kræver token ved build)
  provider: github
  releaseType: release
